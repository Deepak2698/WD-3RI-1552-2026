<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-1</title>
</head>
<body>
    <div>

        <!-- Block Level Element 
            
           Block elements starts on a new line/row and takes/occupies the complete row
            of the web page.

            Examples of block level elements are: <div>, <p>, <h1> to <h6>, <ul>, <ol>, <li>, etc.
        -->

        <!-- div tag/element is a division tag
        
            Nesting of HTML elements is possible in div tag.
            we can add height and width customization to div tag.

        -->
        <div style="background-color: bisque;">Block 1 </div>
        <div style="background-color: lightgray;">Block 2</div>
        <div style="background-color: lightblue;">Block 3</div>

        <!-- Inline Element 
        
            Inline elements does not start on a new line/row and takes/occupies only the space 
            of the content required.

            Examples of inline elements are: <span>, <a>, <img>, <strong>, <em>, etc.

            Nesting of HTML elements is NOT possible in inline elements.
            We cannot add height and width customization to inline elements.

        -->

        <!--  span takes only the text values  -->
        <span style="background-color: brown;" >Inline 1</span>
        <span style="background-color: lightgreen;">Inline 2</span>
        <span style="background-color: lightyellow;">Inline 3</span>

    </div>
</body>
</html>
