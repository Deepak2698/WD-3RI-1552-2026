    <!--
        What is the Difference Between Tags and Elements?

        Tags - Anything enclose within angle brackets ( < , >) is called a tag.
         For example, <p> is a tag. Tags are used to create elements.

        Elements - Anything enclosed between opening and closing tags is called an
         element. 
         
         For example, <p>This is a paragraph.</p> is an element.
         The opening tag is <p>, the closing tag is </p>,
          and the content is "This is a paragraph."

            In summary, tags are the building blocks of HTML,
            while elements are the structures created using those tags.

        
        What are Attributes in HTML?

        Attributes provide additional information about an element. They are
        always included in the opening tag and consist of a name(key) and a value.
          The syntax for attributes is: name="value".
    -->

        <div>

            <!-- Heading -->

            <h1>This is a Heading 1</h1>
            <h2>This is a Heading 2</h2>
